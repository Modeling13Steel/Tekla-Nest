name: License server (validate + deploy)

# Authenticates to GCP via OIDC / Workload Identity Federation — no service
# account key is ever stored as a secret. Requires the one-time bootstrap in
# `license-server/scripts/setup_github_oidc.py` to have been run already
# (see license-server/GUIDE.md § "CI/CD pipeline setup"). If that bootstrap
# is missing, the auth step below fails fast with a message telling you so.

on:
  push:
    paths:
      - "license-server/**"
      - ".github/workflows/license-server-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: license-server-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOYER_SA_EMAIL: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}

jobs:
  validate-keys:
    name: Validate signing/admin keys exist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA_EMAIL }}

      - name: Fail with guidance if OIDC auth failed
        if: steps.auth.outcome == 'failure'
        run: |
          echo "::error::Could not authenticate to GCP via OIDC."
          echo "::error::This usually means the one-time GitHub OIDC bootstrap has not been run yet, or the"
          echo "::error::GCP_PROJECT_ID / GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_DEPLOYER_SA_EMAIL repo variables are unset."
          echo "::error::Run 'python3.12 scripts/setup_github_oidc.py --repo ${{ github.repository }}' locally"
          echo "::error::(with an authenticated gcloud session) — see license-server/GUIDE.md § CI/CD pipeline setup."
          exit 1

      - uses: google-github-actions/setup-gcloud@v2

      - name: Validate required secrets exist and have an enabled version
        run: |
          set -euo pipefail
          missing=0
          for name in JWT_PRIVATE_KEY ADMIN_API_KEY MASTER_ADMIN_API_KEY; do
            if ! gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo "::error::Secret '$name' does not exist in project $GCP_PROJECT_ID."
              missing=1
              continue
            fi
            enabled=$(gcloud secrets versions list "$name" --project="$GCP_PROJECT_ID" \
              --filter="state:ENABLED" --format="value(name)" | head -n1)
            if [ -z "$enabled" ]; then
              echo "::error::Secret '$name' exists but has no enabled version in project $GCP_PROJECT_ID."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required secrets are not deployed. This pipeline never creates or"
            echo "::error::rotates them — run 'python3.12 scripts/deploy.py' (or see GUIDE.md § Create Firebase"
            echo "::error::Functions secrets) once, locally, to provision them, then re-run this workflow."
            exit 1
          fi
          echo "All required secrets present and enabled."

  deploy-functions:
    name: Deploy Cloud Functions
    needs: validate-keys
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    environment: license-server-deploy
    defaults:
      run:
        working-directory: license-server
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA_EMAIL }}

      - name: Fail with guidance if OIDC auth failed
        if: steps.auth.outcome == 'failure'
        run: |
          echo "::error::Could not authenticate to GCP via OIDC — see the validate-keys job log for details,"
          echo "::error::or run 'python3.12 scripts/setup_github_oidc.py --repo ${{ github.repository }}' locally."
          exit 1

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Bootstrap Functions venv
        run: python3.12 scripts/bootstrap_functions_venv.py

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project "$GCP_PROJECT_ID" --non-interactive
