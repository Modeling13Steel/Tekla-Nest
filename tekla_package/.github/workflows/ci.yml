name: CI (lint + test)

# Fast, OS-agnostic checks. Validated locally: ruff clean, 648 tests passing.
# Windows installer builds live in build-windows.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # PySide6 needs these system libraries even in offscreen mode
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Run tests (offscreen Qt, skip Windows-only)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q -m "not windows_only"
