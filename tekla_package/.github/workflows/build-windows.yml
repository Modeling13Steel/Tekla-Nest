name: Build Windows Packages

# ⚠️  REQUIRES A WINDOWS RUNNER — NOT validated on the maintainer's machine (macOS).
# This is a faithful port of the original single-repo build, adapted to the monorepo
# by STAGING the shared inputs (config.yaml + resources/, now in tekla-common) at the
# repo root so the proven installer.iss / prepare-python-embed.ps1 scripts run unchanged.
# Validate this workflow once on GitHub's windows-latest runner before relying on it.

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install workspace + PyInstaller
        run: |
          uv sync
          uv pip install pyinstaller

      # ---- Stage shared inputs at the repo root (config.yaml + resources moved to tekla-common) ----
      - name: Stage build inputs
        shell: pwsh
        run: |
          Copy-Item "tekla-common/src/tekla_common/config.yaml" -Destination "config.yaml" -Force
          Copy-Item -Recurse "tekla-common/src/tekla_common/resources" -Destination "resources" -Force
          Copy-Item "tekla-nest/installer.iss" -Destination "installer.iss" -Force
          Copy-Item "tekla-admin-console/installer-admin.iss" -Destination "installer-admin.iss" -Force

      - name: Download VC++ Redistributable
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "resources/vc_redist.x64.exe"

      - name: Prepare bundled Python with pythonnet
        shell: pwsh
        run: .\scripts\prepare-python-embed.ps1

      - name: Build customer app bundle
        shell: pwsh
        run: |
          $args = @(
            "--name", "tekla-nest",
            "--onedir", "--windowed",
            "--icon", "resources/logo_cut_bar_mark.ico",
            "--version-file", "resources/version_info.txt",
            "--add-data", "config.yaml;.",
            "--add-data", "resources;resources",
            "--distpath", "dist"
          )
          if (Test-Path "tekla-nest/src/tekla_nest/licensing/public_key.pem") {
            $args += @("--add-data", "tekla-nest/src/tekla_nest/licensing/public_key.pem;tekla_nest/licensing")
          }
          $args += "tekla-nest/src/tekla_nest/__main__.py"
          uv run pyinstaller @args

      - name: Build admin app bundle
        shell: pwsh
        run: |
          uv run pyinstaller `
            --name tekla-nest-admin `
            --onedir --windowed `
            --icon "resources/logo_cut_bar_mark.ico" `
            --version-file "resources/version_info.txt" `
            --add-data "config.yaml;." `
            --add-data "resources;resources" `
            --distpath dist `
            tekla-admin-console/src/tekla_admin/__main__.py

      - name: Smoke-test desktop executables
        shell: pwsh
        timeout-minutes: 2
        run: |
          function Test-AppStart($Path, $Name) {
            $proc = Start-Process -FilePath $Path -PassThru
            Start-Sleep -Seconds 5
            if ($proc.HasExited -and $proc.ExitCode -ne 0) {
              Write-Error "$Name crashed on startup with exit code $($proc.ExitCode)"; exit 1
            }
            if (!$proc.HasExited) { $proc.Kill(); Write-Host "$Name started successfully — smoke test passed." }
          }
          Test-AppStart "dist\tekla-nest\tekla-nest.exe" "Tekla Nest"
          Test-AppStart "dist\tekla-nest-admin\tekla-nest-admin.exe" "Tekla Nest Admin"

      - name: Build customer installer
        run: iscc installer.iss

      - name: Build admin installer
        run: iscc installer-admin.iss

      - name: Package license-server infrastructure (tekla-iac)
        shell: pwsh
        run: |
          $infraRoot = "dist\license-server-infrastructure"
          if (Test-Path $infraRoot) { Remove-Item -Recurse -Force $infraRoot }
          New-Item -ItemType Directory -Path $infraRoot | Out-Null
          Copy-Item -Recurse -Path "tekla-iac" -Destination "$infraRoot\tekla-iac"
          Remove-Item -Recurse -Force "$infraRoot\tekla-iac\functions\venv" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$infraRoot\tekla-iac\keys" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$infraRoot\tekla-iac\**\.terraform" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$infraRoot\tekla-iac" -DestinationPath "dist\tekla-nest-license-server-infrastructure.zip" -Force

      - name: Upload customer installer
        uses: actions/upload-artifact@v4
        with: { name: tekla-nest-installer, path: dist/tekla-nest-setup.exe }

      - name: Upload admin installer
        uses: actions/upload-artifact@v4
        with: { name: tekla-nest-admin-installer, path: dist/tekla-nest-admin-setup.exe }

      - name: Upload infrastructure package
        uses: actions/upload-artifact@v4
        with: { name: tekla-nest-license-server-infrastructure, path: dist/tekla-nest-license-server-infrastructure.zip }

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tekla-nest-setup.exe
            dist/tekla-nest-admin-setup.exe
            dist/tekla-nest-license-server-infrastructure.zip
