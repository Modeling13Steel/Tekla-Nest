[project]
name = "tekla-admin-console"
version = "2.1.0"
description = "Tekla Nest Admin Console — issue, revoke and manage licences"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tekla-common",
    "PySide6>=6.5",
    "requests>=2.28",
]

[project.scripts]
tekla-nest-admin = "tekla_admin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tekla-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tekla_admin"]
