<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SCREEN_TITLE}} - {{SPEC_ID}}</title>
  <link rel="stylesheet" href="{{STYLE_PATH}}">
</head>
<body class="prototype-screen">
  <a class="skip-link" href="#main">Skip to prototype content</a>
  <div class="screen-frame" aria-label="Tekla Nest prototype shell">
    <header class="app-chrome">
      <nav class="menu-bar" aria-label="Application menu">
        <a href="{{FILE_MENU_HREF}}">File</a>
        <a href="{{STOCK_MENU_HREF}}">Stock</a>
        <a href="{{NESTING_MENU_HREF}}">Nesting</a>
        <a href="{{VIEW_MENU_HREF}}">View</a>
      </nav>
      <div class="toolbar" role="toolbar" aria-label="Primary actions">
        <div class="brand-mark" aria-hidden="true">TN</div>
        <p class="app-title">M13S Nest</p>
        <div class="toolbar-actions">
          <a class="button button-secondary" href="{{LOAD_PARTS_HREF}}">Load Parts</a>
          <a class="button button-primary" href="{{CALCULATE_HREF}}">Calculate</a>
          <a class="button button-secondary" href="{{EXPORT_HREF}}">Export</a>
        </div>
      </div>
    </header>
    <main id="main" class="app-main">
      {{SCREEN_CONTENT}}
    </main>
    <footer class="status-bar" role="status" aria-live="polite">
      {{STATUS_COPY}}
    </footer>
  </div>
  <aside class="annotations" aria-labelledby="annotation-heading">
    <h2 id="annotation-heading">Prototype annotations</h2>
    {{ANNOTATIONS}}
  </aside>
</body>
</html>
